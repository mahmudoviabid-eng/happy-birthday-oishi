<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Oishi 💖</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 20%,#ffd9ec,#9b5de5 45%,#21104d);color:white}
.scene{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}
.glow{position:absolute;width:65vmax;height:65vmax;border-radius:50%;background:#ffb3de;filter:blur(80px);opacity:.25;animation:pulse 3s ease-in-out infinite}
.card{position:relative;z-index:10;width:min(92vw,650px);padding:28px 20px 34px;text-align:center;border:1px solid rgba(255,255,255,.35);border-radius:30px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);box-shadow:0 25px 80px rgba(0,0,0,.35);animation:enter 1.2s cubic-bezier(.2,.9,.2,1)}
.cake{font-size:clamp(70px,18vw,125px);animation:cakeIn 1.4s .3s both,bob 2s 1.7s ease-in-out infinite}
h1{margin:4px 0;font-size:clamp(38px,10vw,76px);line-height:1.05;font-weight:900;letter-spacing:-2px;text-shadow:0 5px 25px rgba(255,80,170,.65);animation:title 1.5s .7s both}
.name{background:linear-gradient(90deg,#fff,#ffd1ed,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.5s linear infinite}
p{font-size:clamp(15px,4vw,21px);margin:14px auto 20px;max-width:520px}
button{border:0;border-radius:999px;padding:13px 22px;font-size:16px;font-weight:800;background:#fff;color:#8b2f73;box-shadow:0 8px 25px rgba(0,0,0,.2);cursor:pointer}
.balloon{position:absolute;bottom:-160px;width:clamp(48px,12vw,82px);height:clamp(64px,16vw,108px);border-radius:50% 50% 45% 45%;z-index:3;animation:rise linear infinite}
.balloon:after{content:"";position:absolute;left:50%;top:98%;width:1px;height:150px;background:rgba(255,255,255,.6)}
.balloon:before{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid #fff}
.confetti{position:absolute;top:-20px;width:9px;height:15px;z-index:20;animation:fall linear infinite}
.heart{position:absolute;bottom:-50px;font-size:25px;z-index:5;animation:heartRise linear infinite}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff;animation:sparkle 1.8s ease-in-out infinite}
@keyframes enter{from{opacity:0;transform:scale(.55) translateY(50px)}to{opacity:1;transform:none}}
@keyframes cakeIn{from{opacity:0;transform:translateY(100px) scale(.3)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes title{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes shine{to{background-position:200%}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.4}}
@keyframes rise{to{transform:translateY(-125vh) rotate(18deg);opacity:0}}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg);opacity:0}}
@keyframes heartRise{to{transform:translateY(-120vh) scale(1.5) rotate(25deg);opacity:0}}
@keyframes sparkle{50%{transform:scale(2);opacity:.25}}
</style>
</head>
<body>
<div class="scene" id="scene">
<div class="glow"></div>
<div class="card">
<div class="cake">🎂</div>
<h1>Happy Birthday Oishi! 🎂❤️</h1>
<p>Keep smiling, keep shining, and may all your wishes come true. ✨</p>
<button id="start">🎉 👀 Psst… Oishi, look here! 🎉</button>
</div>
</div>
<script>
const scene=document.getElementById('scene');
const balloons=['🎈','🎈','🎈','🎈'];
const hearts=['💖','💕','💗','💓','✨','🌸'];
for(let i=0;i<18;i++){
 const b=document.createElement('div'); b.className='balloon';
 b.textContent=balloons[i%balloons.length];
 b.style.left=(Math.random()*100)+'vw';
 b.style.animationDuration=(7+Math.random()*7)+'s';
 b.style.animationDelay=(-Math.random()*12)+'s';
 b.style.fontSize=(30+Math.random()*25)+'px';
 scene.appendChild(b);
}
for(let i=0;i<90;i++){
 const c=document.createElement('div'); c.className='confetti';
 c.style.left=Math.random()*100+'vw';
 c.style.animationDuration=(3+Math.random()*4)+'s';
 c.style.animationDelay=(-Math.random()*6)+'s';
 c.style.transform='rotate('+Math.random()*360+'deg)';
 c.style.width=(5+Math.random()*8)+'px';
 c.style.height=(8+Math.random()*12)+'px';
 scene.appendChild(c);
}
for(let i=0;i<28;i++){
 const h=document.createElement('div'); h.className='heart';
 h.textContent=hearts[Math.floor(Math.random()*hearts.length)];
 h.style.left=Math.random()*100+'vw';
 h.style.animationDuration=(5+Math.random()*6)+'s';
 h.style.animationDelay=(-Math.random()*8)+'s';
 scene.appendChild(h);
}
for(let i=0;i<25;i++){
 const s=document.createElement('div'); s.className='spark';
 s.style.left=Math.random()*100+'vw'; s.style.top=Math.random()*100+'vh';
 s.style.animationDelay=(-Math.random()*2)+'s'; scene.appendChild(s);
}
document.getElementById('start').onclick=()=>{
 document.getElementById('start').textContent='💖 Happy Birthday Oishi! 💖';
 for(let i=0;i<45;i++){
   const h=document.createElement('div'); h.className='heart'; h.textContent='💖';
   h.style.left='50vw'; h.style.bottom='35vh'; h.style.animationDuration=(2+Math.random()*3)+'s';
   scene.appendChild(h);
 }
 // tiny celebratory melody using Web Audio; starts only after a user tap
 try{
   const C=window.AudioContext||window.webkitAudioContext, a=new C();
   [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
     const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='sine';
     g.gain.setValueAtTime(.0001,a.currentTime+i*.18);
     g.gain.exponentialRampToValueAtTime(.12,a.currentTime+i*.18+.02);
     g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+i*.18+.28);
     o.connect(g).connect(a.destination);o.start(a.currentTime+i*.18);o.stop(a.currentTime+i*.18+.3);
   });
 }catch(e){}
};
</script>
</body>
</html>
