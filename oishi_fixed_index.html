<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday Oishi</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;height:100vh;background:radial-gradient(circle,#fff5fb,#ffd7eb,#c9d8ff);font-family:system-ui;text-align:center;color:#542344}.scene{position:relative;height:100vh;overflow:hidden}.title{position:absolute;top:10%;left:50%;transform:translateX(-50%);width:95%;font-size:clamp(2.2rem,10vw,5rem);font-weight:900;animation:pop 1s both}.sub{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:90%;font-size:clamp(1rem,4.5vw,1.5rem)}.cake{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:clamp(7rem,28vw,13rem);animation:bob 2s infinite}.balloon{position:absolute;width:42px;height:54px;border-radius:50%;animation:float 5s infinite}.balloon:after{content:"";position:absolute;left:50%;top:52px;height:100px;border-left:1px solid #777}.balloon:nth-child(1){left:5%;top:15%}.balloon:nth-child(2){left:15%;top:7%;animation-delay:1s}.balloon:nth-child(3){right:6%;top:16%;animation-delay:.6s}.balloon:nth-child(4){right:15%;top:7%;animation-delay:1.3s}.balloon:nth-child(5){left:3%;bottom:20%;animation-delay:1.8s}.balloon:nth-child(6){right:3%;bottom:22%;animation-delay:.5s}.balloon:nth-child(7){left:25%;top:12%;animation-delay:2s}.balloon:nth-child(8){right:24%;top:12%;animation-delay:1.1s}.heart{position:absolute;font-size:2rem;animation:rise 5s linear infinite}.spark{position:absolute;font-size:1.4rem;animation:twinkle 1.5s infinite}.conf{position:absolute;width:9px;height:18px;border-radius:3px;animation:fall 4s linear infinite}button{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);border:0;border-radius:999px;padding:14px 24px;font-size:1rem;font-weight:800;background:white;color:#8d2d68;box-shadow:0 10px 30px #0002}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.5)}to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes bob{50%{transform:translate(-50%,-57%) rotate(2deg)}}@keyframes float{50%{transform:translateY(-25px) rotate(4deg)}}@keyframes rise{from{transform:translateY(110vh);opacity:0}15%{opacity:1}to{transform:translateY(-15vh);opacity:0}}@keyframes twinkle{50%{opacity:1;transform:scale(1.4)}}@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(720deg)}}
</style></head><body><div class="scene" id="scene"><div class="title">Happy Birthday Oishi 💖</div><div class="sub">Wishing you a day full of smiles, love & magic ✨</div><div class="cake">🎂</div><div class="balloon"></div><div class="balloon"></div><div class="balloon"></div><div class="balloon"></div><div class="balloon"></div><div class="balloon"></div><div class="balloon"></div><div class="balloon"></div><button id="surprise">Tap for a little surprise 💕</button></div><script>
const s=document.getElementById('scene'),c=['#ff8fab','#ffd166','#8ecae6','#b8e986','#cdb4db','#ffb4a2'];document.querySelectorAll('.balloon').forEach((b,i)=>b.style.background=c[i%c.length]);for(let i=0;i<90;i++){let e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.top=-Math.random()*100+'vh';e.style.animationDelay=Math.random()*4+'s';e.style.background=c[i%c.length];s.appendChild(e)}for(let i=0;i<28;i++){let e=document.createElement('i');e.className='heart';e.textContent='💖';e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*5+'s';s.appendChild(e)}for(let i=0;i<25;i++){let e=document.createElement('i');e.className='spark';e.textContent='✨';e.style.left=Math.random()*100+'vw';e.style.top=Math.random()*100+'vh';s.appendChild(e)}document.getElementById('surprise').onclick=()=>{for(let i=0;i<12;i++){let e=document.createElement('i');e.className='heart';e.textContent='💗';e.style.left=40+Math.random()*20+'vw';e.style.bottom='10vh';s.appendChild(e)}};
</script></body></html>
